spring.application.name=proicio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signal}
spring.datasource.username=${DB_USER:signal}
spring.datasource.password=${DB_PASSWORD:signal}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-1234567890}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
