services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./backend/model
    env_file:
      - ./backend/model/.env
    ports:
      - "5000:5000"

volumes:
  postgres-data:
